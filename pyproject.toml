[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "patentes"
version = "0.1.0"
description = "Agente de PI: acompanhamento processual INPI e EPO OPS via MCP"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "pypdf",
    "google-cloud-bigquery",
    "mcp>=1.28,<2",
    "duckdb",
    "python-dotenv",
    "dogpile.cache",
    "python-epo-ops-client",
    "httpx",
    "requests",
    "beautifulsoup4",
    "openpyxl",
    "starlette",
    "uvicorn",
    "reportlab",
    "playwright",
]

[tool.setuptools]
packages = ["inpi", "epo", "vigilancia", "busca", "landscape", "enriquecimento", "enriquecimento.fontes"]

[tool.pytest.ini_options]
markers = ["online: requer credencial/rede real, nao roda no fluxo padrao"]
addopts = "-m \"not online\""
norecursedirs = ["vendor", ".venv", ".git"]
