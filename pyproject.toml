[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "patentes"
version = "0.1.0"
description = "Agente de PI: acompanhamento processual INPI e EPO OPS via MCP"
requires-python = ">=3.12"
dependencies = ["pyyaml", "pypdf"]

[tool.setuptools]
packages = ["inpi", "epo", "vigilancia", "busca"]
