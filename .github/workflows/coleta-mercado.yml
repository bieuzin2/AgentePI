name: Coleta de mercado (concorrentes -> nacional)

on:
  workflow_dispatch:
    inputs:
      tamanho_lote:
        description: 'Processos por lote'
        required: false
        default: '120'
      paralelismo:
        description: 'Requisicoes concorrentes dentro de cada lote'
        required: false
        default: '30'
      duracao_maxima_minutos:
        description: 'Para gracioso apos esse tempo (fila retoma sozinha na proxima execucao)'
        required: false
        default: '60'

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala dependencias
        run: pip install -e .

      - name: Roda a coleta
        env:
          INPI_PAG_LOGIN_MERCADO: ${{ secrets.INPI_PAG_LOGIN_MERCADO }}
          INPI_PAG_PASSWORD_MERCADO: ${{ secrets.INPI_PAG_PASSWORD_MERCADO }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          COLETA_MERCADO_TAMANHO_LOTE: ${{ github.event.inputs.tamanho_lote }}
          COLETA_MERCADO_PARALELISMO: ${{ github.event.inputs.paralelismo }}
          DURACAO_MAXIMA_MINUTOS: ${{ github.event.inputs.duracao_maxima_minutos }}
        run: |
          export COLETA_MERCADO_DURACAO_MAXIMA_SEGUNDOS=$((DURACAO_MAXIMA_MINUTOS * 60))
          python -u -m inpi.coleta_mercado

      - name: Sobe o que foi coletado nesta execucao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ficha-extras-parcial-${{ github.run_id }}
          path: inpi/referencias/ficha-extras.csv
          if-no-files-found: warn
          retention-days: 90
