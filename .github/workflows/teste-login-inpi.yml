name: Teste de login INPI (diagnostico)

# So testa autenticacao (POST /sys/auth/signIn) -- nao coleta nada, nao
# chama nenhuma outra rota. Objetivo: isolar se o 403 do runner do GitHub
# Actions e credencial errada nos secrets ou bloqueio por origem/IP do
# datacenter (testando com a credencial de PRODUCAO, que sabemos que
# funciona de uma maquina local).
#
# Apagar este workflow depois do diagnostico -- e so ferramenta de teste,
# nao faz parte do sistema de coleta.

on:
  workflow_dispatch:

jobs:
  testar-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala dependencias
        run: pip install httpx

      - name: Tenta logar (so autenticacao, sem coletar nada)
        env:
          INPI_PAG_LOGIN: ${{ secrets.INPI_PAG_LOGIN }}
          INPI_PAG_PASSWORD: ${{ secrets.INPI_PAG_PASSWORD }}
        run: |
          python -c "
          import os
          import httpx

          login = os.environ['INPI_PAG_LOGIN']
          senha = os.environ['INPI_PAG_PASSWORD']

          with httpx.Client(
              base_url='https://servicos.patentes.inpi.gov.br/api/1/servicedesk-embedded',
              timeout=30.0,
          ) as http:
              r = http.post(
                  '/sys/auth/signIn/defaultAuthenticatorCustomer',
                  json={'userLogin': login, 'userPassword': senha},
              )
              print(f'status: {r.status_code}')
              print(f'corpo: {r.text[:500]}')
              if r.status_code == 200:
                  print('LOGIN OK -- nao e bloqueio de origem/IP.')
              elif r.status_code == 403:
                  print('403 mesmo com credencial de producao -- bloqueio por origem/IP do runner, nao e problema de credencial.')
              else:
                  print(f'status inesperado: {r.status_code}')
          "
